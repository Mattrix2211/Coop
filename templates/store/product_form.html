{% extends 'base.html' %}
{% block title %}{{ title }} - Coop{% endblock %}
{% block content %}
<h2 class="mb-3">{{ title }}</h2>
<form method="post" enctype="multipart/form-data" class="card p-3">
  {% csrf_token %}
  {{ form.as_p }}
  <div>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
    <a class="btn btn-secondary" href="{% url 'product_list' %}">Annuler</a>
  </div>
</form>
{% endblock %}
