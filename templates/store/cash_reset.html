{% extends 'base.html' %}
{% block title %}Fond de caisse - Coop{% endblock %}
{% block content %}
<h2 class="mb-3">Initialiser / Réinitialiser la caisse</h2>
<form method="post" class="row g-3">
  {% csrf_token %}
  <div class="col-12 col-md-8">
    <div class="card p-3">
      <h5 class="mb-2">Billets / Pièces du fond</h5>
      <div class="row g-2">
        {% for d in denominations %}
        <div class="col-6 col-sm-4 col-lg-3">
          <label class="form-label small">{{ d }} €</label>
          <input type="number" min="0" name="denom_{{ d|stringformat:'s'|replace:'.','_' }}" class="form-control form-control-sm" value="0" />
        </div>
        {% endfor %}
      </div>
      <hr />
      <label class="form-label small">Nombre de chèques présents</label>
      <input type="number" min="0" name="cheques_count" class="form-control form-control-sm" value="0" />
    </div>
  </div>
  <div class="col-12 col-md-4">
    <div class="card p-3 h-100">
      <h5 class="mb-2">Note (optionnel)</h5>
      <textarea name="note" rows="6" class="form-control" placeholder="Observations..."></textarea>
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary">Enregistrer le fond</button>
        <a href="{% url 'cash_dashboard' %}" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </div>
  </div>
</form>
{% endblock %}
