{% extends 'base.html' %}
{% block title %}{{ title }} - Coop{% endblock %}
{% block content %}
<h2 class="mb-3">{{ title }}</h2>
<form method="post" class="card p-3">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Nom</label>
    <input class="form-control" type="text" name="name" value="{{ category.name|default:'' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <input class="form-control" type="text" name="description" value="{{ category.description|default:'' }}">
  </div>
  <div>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
    <a class="btn btn-secondary" href="{% url 'category_list' %}">Annuler</a>
  </div>
</form>
{% endblock %}
