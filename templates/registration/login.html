<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion – Coop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card shadow-sm" style="width:100%;max-width:400px;">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <img src="{% static 'img/logo.png' %}" alt="Coop" style="height:60px;" class="mb-2">
      <h4 class="fw-bold mb-0">Coop</h4>
      <p class="text-muted small">Caisse enregistreuse</p>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger py-2 small">Identifiants incorrects. Veuillez réessayer.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Nom d'utilisateur</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Mot de passe</label>
        <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
